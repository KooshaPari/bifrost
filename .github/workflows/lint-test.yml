name: Lint & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-test:
    name: lint-test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone sibling dependencies for replace directives
        shell: bash
        run: |
          set -euo pipefail
          # go.mod uses relative replace directives (../../<repo>).
          # GitHub Actions checks out to $GITHUB_WORKSPACE, so ../../ resolves
          # relative to the repo root. Clone sibling repos at those paths.
          git clone --depth 1 https://github.com/maximhq/bifrost.git ../../bifrost
          git clone --depth 1 https://github.com/coder/agentapi.git ../../agentapi-plusplus
          git clone --depth 1 https://github.com/KooshaPari/cliproxyapi-plusplus.git ../../CLIProxyAPI
          mkdir -p ../../template-commons
          git clone --depth 1 https://github.com/KooshaPari/phenotype-go-kit.git ../../template-commons/phenotype-go-kit

          # CLIProxyAPI declares a different module path than what go.mod expects.
          sed -i 's|^module .*|module github.com/kooshapari/CLIProxyAPI/v7|' ../../CLIProxyAPI/go.mod

          # agentapi-plusplus declares module github.com/coder/agentapi — match expected path.
          # No fixup needed since we cloned to the replace target path.

      - uses: KooshaPari/phenotypeActions/actions/lint-test@main
